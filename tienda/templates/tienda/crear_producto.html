{% extends "TiendaGenesisApp/base.html" %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <h1 class="fw-bold mb-4">
                        Publicar producto
                    </h1>

                    <form method="post"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            {{ form.nombre }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Categoría
                            </label>

                            {{ form.categoria }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Descripción
                            </label>

                            {{ form.descripcion }}

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Precio
                                </label>

                                {{ form.precio }}

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stock
                                </label>

                                {{ form.stock }}

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Imagen
                            </label>

                            {{ form.imagen }}

                        </div>

                        <div class="form-check mb-4">

                            {{ form.disponible }}

                            <label class="form-check-label">
                                Producto disponible
                            </label>

                        </div>

                        <button type="submit"
                                class="btn btn-success btn-lg">

                            Guardar producto

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
